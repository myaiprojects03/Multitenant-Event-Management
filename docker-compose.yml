name: eventai

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventai}
      POSTGRES_DB: ${POSTGRES_DB:-eventai}
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres on 5432
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file: .env
    environment:
      # inside the compose network, services are reached by name on their internal ports
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eventai}:${POSTGRES_PASSWORD:-eventai}@db:5432/${POSTGRES_DB:-eventai}
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD:-app_rw_dev}@db:5432/${POSTGRES_DB:-eventai}
      READONLY_DATABASE_URL: postgresql+asyncpg://app_readonly:${APP_READONLY_PASSWORD:-app_readonly_dev}@db:5432/${POSTGRES_DB:-eventai}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["arq", "app.workers.main.WorkerSettings"]
    env_file: .env
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eventai}:${POSTGRES_PASSWORD:-eventai}@db:5432/${POSTGRES_DB:-eventai}
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD:-app_rw_dev}@db:5432/${POSTGRES_DB:-eventai}
      READONLY_DATABASE_URL: postgresql+asyncpg://app_readonly:${APP_READONLY_PASSWORD:-app_readonly_dev}@db:5432/${POSTGRES_DB:-eventai}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
