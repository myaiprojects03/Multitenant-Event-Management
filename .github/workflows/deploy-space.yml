# Deploy the API to a Hugging Face Space (Docker) after CI passes on main.
#
# Setup once: a Hugging Face access token with write access as the repo secret HF_TOKEN, and
# the Space id ("<hf-user>/eventai-api") as the repo variable HF_SPACE. The workflow creates
# the Space if it does not exist. Until HF_SPACE is set it does nothing.
name: Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=0.30,<1"
      - name: Stage the Space (backend + Space README)
        run: |
          mkdir space
          git archive HEAD:backend | tar -x -C space
          rm -rf space/tests space/evals/reports
          cp deploy/hf-space/README.md space/README.md
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python deploy/hf-space/push.py space
