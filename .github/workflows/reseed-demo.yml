# Reseed the hosted demo's database (Neon) nightly, and on demand for the first seed.
#
# The synthetic data is dated relative to the day it is generated ("yesterday's lead spike",
# "tomorrow's overbooked workshop"), so the hosted demo needs a fresh seed daily. Generating it
# and embedding ~1,300 cards takes under a minute here but far longer on Render's free 0.1 CPU.
#
# Needs the same two values as the Render service, as repo secrets: DATABASE_OWNER_URL (Neon's
# owner connection string) and APP_SECRET. The app role URLs and passwords are derived from
# them, so this job can also run the migrations: it works before the API is deployed.
name: Reseed demo

on:
  schedule:
    - cron: "10 0 * * *"  # 00:10 UTC daily
  workflow_dispatch:

concurrency:
  group: reseed-demo
  cancel-in-progress: false

jobs:
  reseed:
    if: github.repository_owner == 'myaiprojects03'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$DATABASE_OWNER_URL" ] || [ -z "$APP_SECRET" ]; then
            echo "::error::Add repo secrets DATABASE_OWNER_URL (Neon connection string) and APP_SECRET"
            exit 1
          fi
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: backend/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Migrate and sync the app role passwords
        run: |
          alembic upgrade head
          python -m app.sync_roles
      # the seed writes as the owner; re-indexing connects as app_rw (derived from APP_SECRET)
      # and refuses to run on a connection that bypasses RLS
      - name: Reseed and re-index
        run: python -m app.seed
