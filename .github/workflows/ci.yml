name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eventai
          POSTGRES_PASSWORD: eventai
          POSTGRES_DB: eventai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventai" --health-interval 5s --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://eventai:eventai@localhost:5432/eventai
      DATABASE_URL: postgresql+asyncpg://app_rw:app_rw_dev@localhost:5432/eventai
      READONLY_DATABASE_URL: postgresql+asyncpg://app_readonly:app_readonly_dev@localhost:5432/eventai
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: backend/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: ruff check . && ruff format --check .
      - run: alembic upgrade head
      # loads demo data, then embeds it for the assistant (local fastembed, no API calls)
      - run: python -m app.seed
      # unit + RLS isolation tests; no LLM calls
      - run: pytest -q
      # deterministic evals (workflows, matching, SQL guard + database, access control, consent);
      # any leak or failing case fails the build
      - run: python -m evals.run --no-llm --strict --out evals/reports/ci.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # type-checks and builds every page
      - run: npm run build
