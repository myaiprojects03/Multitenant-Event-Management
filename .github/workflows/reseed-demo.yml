# Reseed the hosted demo's database every night (and on demand for the first seed).
#
# The synthetic data is dated relative to the day it is generated ("yesterday's lead spike",
# "tomorrow's overbooked workshop"), so the hosted demo needs a fresh seed daily. Generating it
# and embedding ~1,300 cards takes ~30 s on a runner but far longer on Render's free 0.1 CPU,
# so it runs here. Needs two repo secrets: RENDER_DATABASE_URL, the database's *External*
# connection string (owner), and RENDER_APP_RW_PASSWORD, the API's APP_RW_PASSWORD env var.
# Deploy the API first: it runs the migrations and creates the app roles with their passwords.
name: Reseed demo

on:
  schedule:
    - cron: "10 0 * * *"  # 00:10 UTC daily
  workflow_dispatch:

concurrency:
  group: reseed-demo
  cancel-in-progress: false

jobs:
  reseed:
    if: github.repository_owner == 'myaiprojects03'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: backend/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Point the seed at the Render database
        env:
          RENDER_DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          RENDER_APP_RW_PASSWORD: ${{ secrets.RENDER_APP_RW_PASSWORD }}
        # The seed writes as the owner. Re-indexing must use app_rw: it relies on RLS to see one
        # event at a time (app.ingest refuses to run on a connection that bypasses RLS).
        run: |
          python - <<'EOF'
          import os
          from urllib.parse import quote, urlsplit

          raw, rw = os.environ["RENDER_DATABASE_URL"], os.environ["RENDER_APP_RW_PASSWORD"]
          if not raw or not rw:
              raise SystemExit(
                  "::error::Add repo secrets RENDER_DATABASE_URL (Render > eventai-db > External "
                  "Database URL) and RENDER_APP_RW_PASSWORD (Render > eventai-api > Environment "
                  "> APP_RW_PASSWORD)"
              )
          u = urlsplit(raw)
          where = f"{u.hostname}:{u.port or 5432}{u.path}?ssl=require"
          owner = f"postgresql+asyncpg://{u.username}:{quote(u.password or '', safe='')}@{where}"
          app_rw = f"postgresql+asyncpg://app_rw:{quote(rw, safe='')}@{where}"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for url in (owner, app_rw):
                  print(f"::add-mask::{url}")
              env.write(f"MIGRATION_DATABASE_URL={owner}\nDATABASE_URL={app_rw}\n")
          EOF
      - name: Check the API has migrated the database
        run: |
          python - <<'EOF'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.core.config import get_settings

          async def main():
              engine = create_async_engine(get_settings().migration_database_url)
              async with engine.connect() as c:
                  ok = (await c.execute(text("SELECT to_regclass('public.alembic_version')"))).scalar()
              await engine.dispose()
              if not ok:
                  raise SystemExit("The database has no schema yet: deploy the API on Render first.")

          asyncio.run(main())
          EOF
      - name: Reseed and re-index
        run: python -m app.seed
